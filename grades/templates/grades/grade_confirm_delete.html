{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h4>⚠️ Ви впевнені, що хочете видалити цю оцінку?</h4>
    <p><strong>{{ grade.student.username }}</strong> - {{ grade.subject }}: {{ grade.grade }}</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">🗑️ Видалити</button>
        <a href="{% url 'grades:list' %}" class="btn btn-secondary">↩️ Відміна</a>
    </form>
</div>
{% endblock %}
