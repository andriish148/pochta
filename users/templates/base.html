<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Нова Пошта{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">🏠 Нова Пошта</a>
            
            <div class="ml-auto">
                {% if user.is_authenticated %}
                    <span class="text-dark mr-3">👋 {{ user.username }}</span>
                    <form action="{% url 'logout' %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Вийти</button>
                    </form>
                {% else %}
                    <a href="{% url 'users:register' %}" class="btn btn-outline-success btn-sm">Реєстрація</a>
                    <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Увійти</a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
