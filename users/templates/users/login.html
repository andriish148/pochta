{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h3>🔑 Вхід до системи</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        {% if form.errors %}
                            <div class="alert alert-danger">
                                <strong>Помилка!</strong> Невірний логін або пароль.
                            </div>
                        {% endif %}
                        
                        <div class="form-group mb-3">
                            <label for="id_username">Логін</label>
                            <input type="text" name="username" id="id_username" class="form-control" placeholder="Введіть логін">
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="id_password">Пароль</label>
                            <input type="password" name="password" id="id_password" class="form-control" placeholder="Введіть пароль">
                        </div>
                        
                        <button type="submit" class="btn btn-success btn-block w-100">Увійти</button>
                    </form>
                    
                    <hr>
                    
                    <div class="text-center">
                        <p>Немає акаунту? <a href="{% url 'users:register' %}" class="text-primary">Зареєструватися</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
